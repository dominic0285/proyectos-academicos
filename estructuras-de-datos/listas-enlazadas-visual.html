<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Enlazadas con Grafos y Apuntadores</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 30px;
        }
        .contenedor-listas {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 1200px; /* Aumentamos el ancho máximo */
        }
        .lista {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 30%; /* Mantiene el tamaño pero será más flexible */
            text-align: center;
        }
        .lista h3 {
            margin-bottom: 20px;
            color: #333;
        }
        .input-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100px;
            margin-right: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .cuadro {
            display: inline-block;
            width: 60px; /* Aumentamos el ancho */
            height: 60px; /* Aumentamos la altura */
            border: 2px solid #4CAF50;
            border-radius: 5px;
            margin: 5px;
            font-size: 22px; /* Ajustamos el tamaño de la fuente */
            line-height: 60px;
            color: #4CAF50;
        }
        /* Estilo especial para la lista 3 */
        .lista3-special {
            border: 2px dashed #4CAF50;
        }
        /* Asegurar que los cuadros se alineen en una fila */
        .lista-cuadros {
            display: flex;
            justify-content: center;
            flex-wrap: nowrap; /* Evita que los cuadros se muevan a una nueva línea */
        }
    </style>
</head>
<body>

    <!-- Título principal -->
    <h1>Listas Enlazadas con Grafos</h1>

    <!-- Contenedor que agrupa las listas -->
    <div class="contenedor-listas">

        <!-- Lista 1 -->
        <div class="lista">
            <h3>Lista 1</h3>
            <div id="lista1-cuadros" class="lista-cuadros"></div>
            <div class="input-container">
                <input type="number" id="input-lista1" placeholder="Número">
                <button onclick="agregarALista(1)">Agregar</button>
            </div>
        </div>

        <!-- Lista 2 -->
        <div class="lista">
            <h3>Lista 2</h3>
            <div id="lista2-cuadros" class="lista-cuadros"></div>
            <div class="input-container">
                <input type="number" id="input-lista2" placeholder="Número">
                <button onclick="agregarALista(2)">Agregar</button>
            </div>
        </div>

        <!-- Lista 3 -->
        <div class="lista lista3-special">
            <h3>Lista 3 (Random)</h3>
            <div id="lista3-cuadros" class="lista-cuadros"></div>
            <button onclick="llenarLista3()">Llenar Random</button>
        </div>

    </div>

    <script>
        // Definir la clase Nodo para representar cada elemento de la lista enlazada
        class Nodo {
            constructor(dato) {
                this.dato = dato;      // Valor del nodo
                this.siguiente = null; // Apuntador al siguiente nodo
            }
        }

        // Clase que maneja la lista enlazada
        class ListaEnlazada {
            constructor() {
                this.cabeza = null;  // El primer nodo de la lista
                this.tamano = 0;     // Controla el tamaño de la lista (máx. 5 nodos)
            }

            // Método para agregar un nuevo nodo a la lista enlazada
            agregar(dato) {
                if (this.tamano < 5) {  // Límite de 5 nodos
                    let nuevoNodo = new Nodo(dato);  // Crear el nuevo nodo
                    if (!this.cabeza) {
                        this.cabeza = nuevoNodo;     // Si la lista está vacía, este será el primer nodo
                    } else {
                        let actual = this.cabeza;    // Empezar desde la cabeza
                        while (actual.siguiente) {   // Buscar el último nodo
                            actual = actual.siguiente;
                        }
                        actual.siguiente = nuevoNodo; // Agregar el nuevo nodo al final
                    }
                    this.tamano++;  // Incrementar el tamaño de la lista
                } else {
                    alert("La lista está llena (máximo 5 elementos)");
                }
            }

            // Método para obtener los valores de la lista enlazada en un array
            obtenerLista() {
                let lista = [];
                let actual = this.cabeza;
                while (actual) {
                    lista.push(actual.dato);  // Añadir cada nodo al array
                    actual = actual.siguiente; // Mover al siguiente nodo
                }
                return lista;  // Devolver el array con los valores
            }
        }

        // Inicializar tres listas enlazadas
        let lista1 = new ListaEnlazada();
        let lista2 = new ListaEnlazada();
        let lista3 = new ListaEnlazada();

        // Función para agregar un número a la lista 1 o lista 2
        function agregarALista(numeroLista) {
            let input = document.getElementById(`input-lista${numeroLista}`);
            let valor = parseInt(input.value); // Obtener el valor ingresado

            // Validar que sea un número
            if (isNaN(valor)) {
                alert("Por favor ingresa un número válido");
                return;
            }

            // Según el número de lista, agregar el valor a la lista correspondiente
            if (numeroLista === 1) {
                lista1.agregar(valor);
                actualizarGraficos(lista1, 'lista1-cuadros');  // Actualizar gráficos
            } else {
                lista2.agregar(valor);
                actualizarGraficos(lista2, 'lista2-cuadros');  // Actualizar gráficos
            }

            input.value = '';  // Limpiar el campo de entrada
        }

        // Función para actualizar la interfaz con los valores de la lista enlazada
        function actualizarGraficos(lista, idContenedor) {
            let contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = '';  // Limpiar el contenedor antes de actualizar
            let valores = lista.obtenerLista();  // Obtener los valores de la lista

            // Crear cuadros para representar visualmente cada valor
            for (let i = 0; i < 5; i++) {
                let cuadro = document.createElement('div');
                cuadro.className = 'cuadro';
                cuadro.textContent = valores[i] !== undefined ? valores[i] : '';  // Si hay valor, mostrarlo
                contenedor.appendChild(cuadro);
            }
        }

        // Función para llenar la lista 3 de manera aleatoria
        function llenarLista3() {
            let lista1_vals = lista1.obtenerLista();
            let lista2_vals = lista2.obtenerLista();

            // Asegurarse que ambas listas tengan 5 valores
            if (lista1_vals.length < 5 || lista2_vals.length < 5) {
                alert("Ambas listas deben tener 5 valores antes de llenar la lista random");
                return;
            }

            // Combinar las dos listas y seleccionar aleatoriamente 5 elementos
            let combinada = lista1_vals.concat(lista2_vals);
            let seleccionados = [];

            // Seleccionar 5 elementos aleatorios sin repetición
            while (seleccionados.length < 5) {
                let indiceAleatorio = Math.floor(Math.random() * combinada.length);
                seleccionados.push(combinada[indiceAleatorio]);
                combinada.splice(indiceAleatorio, 1);  // Eliminar el elemento seleccionado
            }

            // Reiniciar la lista 3 y agregar los valores seleccionados
            lista3 = new ListaEnlazada();
            seleccionados.forEach(num => lista3.agregar(num));

            // Actualizar la representación gráfica de la lista 3
            actualizarGraficos(lista3, 'lista3-cuadros');
        }
    </script>
</body>
</html>
